<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>da_agent · 数据分析</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <span class="dot"></span>
        <strong>da_agent</strong>
      </div>

      <div class="side-head">
        <span>工作区</span>
        <button class="mini-btn" id="btn-add-ws" title="添加数据库">＋</button>
      </div>
      <div class="ws-list" id="ws-list"></div>

      <div class="side-head">
        <span>会话</span>
        <button class="mini-btn" id="btn-new-session" title="新对话">＋</button>
      </div>
      <div class="session-list" id="session-list"></div>

      <div class="side-head">
        <span>表</span>
        <span class="side-count" id="table-count"></span>
      </div>
      <div class="table-list" id="table-list"></div>

      <button class="model-chip" id="btn-model">
        <span class="chip-dot"></span>
        <span class="chip-text" id="model-label">未配置模型</span>
        <span class="chip-caret">›</span>
      </button>
    </aside>

    <main class="main">
      <header class="bar">
        <div class="bar-inner">
          <button class="icon-btn menu-btn" id="btn-menu" title="工作区">☰</button>
          <div class="brand">
            <strong id="ws-title">…</strong>
            <span class="sub" id="ws-sub"></span>
          </div>
          <div class="bar-right">
            <div class="status" id="status">就绪</div>
            <button class="icon-btn" id="theme" title="切换明暗主题">☾</button>
          </div>
        </div>
      </header>

      <div class="log" id="log"></div>

      <footer class="composer">
        <div class="composer-inner">
          <textarea id="q" rows="1" placeholder="输入问题，Enter 发送，Shift + Enter 换行"></textarea>
          <button id="send" title="发送">发送</button>
        </div>
      </footer>
    </main>
  </div>

  <!-- 添加数据库 -->
  <div class="modal" id="modal-ws" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span>添加数据库</span>
        <button class="modal-x" data-close>✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>SQLite 文件路径</span>
          <input id="ws-path" placeholder="D:\data\mydb.db" />
        </label>
        <label class="field">
          <span>显示名（可选）</span>
          <input id="ws-name" placeholder="默认用文件名" />
        </label>
        <p class="hint-text">添加后会自动分析表结构，结果保存在 workspaces/&lt;id&gt;/ 下。</p>
        <p class="form-error" id="ws-error" hidden></p>
      </div>
      <div class="modal-foot">
        <button class="ghost" data-close>取消</button>
        <button id="ws-submit">开始分析</button>
      </div>
    </div>
  </div>

  <!-- 模型设置 -->
  <div class="modal" id="modal-model" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span>模型设置</span>
        <button class="modal-x" data-close>✕</button>
      </div>
      <div class="modal-body">
        <div class="model-list" id="model-list"></div>

        <div class="section-title">添加模型</div>
        <div class="provider-grid" id="provider-grid"></div>

        <div class="form" id="model-form">
          <label class="field">
            <span>显示名</span>
            <input id="m-name" placeholder="DeepSeek" />
          </label>
          <label class="field">
            <span>Base URL</span>
            <input id="m-base" placeholder="https://api.deepseek.com" />
          </label>
          <div class="field">
            <span>模型名</span>
            <div class="field-row">
              <input id="m-model" list="model-options" placeholder="deepseek-flash" />
              <button type="button" class="ghost small" id="m-discover">获取列表</button>
            </div>
            <datalist id="model-options"></datalist>
          </div>
          <label class="field">
            <span>API Key</span>
            <input id="m-key" type="password" placeholder="sk-…" autocomplete="off" />
          </label>
          <p class="hint-text" id="m-hint"></p>
          <p class="form-error" id="m-error" hidden></p>
          <p class="form-ok" id="m-ok" hidden></p>
          <p class="hint-text">预设只是参考，地址和模型名都可以直接改。</p>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="ghost" id="m-test">测试连接</button>
        <button type="button" id="m-submit">保存并启用</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
